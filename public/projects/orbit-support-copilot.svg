  <rect x="352" y="207" width="446" height="94" rx="11" fill="#1c1d2b"/><text x="374" y="237" fill="#d7d5e0" font-family="Arial,sans-serif" font-size="14">Hi, I placed an order last week but haven't</text><text x="374" y="260" fill="#d7d5e0" font-family="Arial,sans-serif" font-size="14">received a shipping update yet. Could you</text><text x="374" y="283" fill="#d7d5e0" font-family="Arial,sans-serif" font-size="14">help me check the status?</text>
